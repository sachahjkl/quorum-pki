name: CI and GitHub Pages

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build the laboratory
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Go tests and static checks
        run: |
          make test
          make vet

      - name: Build and verify WebAssembly
        run: |
          make wasm-test
          node scripts/ui-review.cjs

      - name: Prepare the static site
        run: |
          mkdir -p _site
          cp web/* _site/
          python3 - <<'PY'
          from pathlib import Path

          page = Path('_site/index.html')
          html = page.read_text()
          native = '<option value="native">Native Go / SSE</option>'
          assert native in html, 'Runtime selector changed; update Pages preparation'
          page.write_text(html.replace(native, ''))
          PY
          touch _site/.nojekyll

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
